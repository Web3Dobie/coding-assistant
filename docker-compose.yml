version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # For development: mount source code for hot reload
      - ./backend:/app
      # For data persistence
      - ./data:/app/data
      # For logs (create the file first if it doesn't exist)
      - ./backend/chat_log.json:/app/chat_log.json
    networks:
      - coding-assistant-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend/chat-ui
      dockerfile: Dockerfile
    ports:
      - "5174:80" # ← FIXED: Nginx runs on port 80 inside container
    depends_on:
      backend:
        condition: service_healthy # Wait for backend to be healthy
    # Remove volume mount for production builds
    # volumes:
    #   - ./frontend/chat-ui:/app  # ← REMOVE this for production
    networks:
      - coding-assistant-network
    environment:
      # Frontend doesn't need the Azure secrets
      - NODE_ENV=production
    restart: unless-stopped

networks:
  coding-assistant-network:
    driver: bridge
